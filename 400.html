<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <link href="/ZoUMusic/images/NothingZoU.png" rel="icon" type="image/png">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>400 Bad Request - ZoUMusic</title>
        <style> 
            .dark-background {
                background-color: black;
                color: white;
            }
            .brighttext {
                color: white;
                text-decoration-color: white;
            }
            .darkslateblue-button {
                background-color: darkslateblue;
                color: white;
                border-radius: 8px;
                text-align: center;
                padding: 8px;
                font-size: larger;
                display: inline-block;
                text-decoration: none;
            }
            body {
                font-family: Arial, sans-serif;
                text-align: center;
                padding-top: 80px;
            }
            h1 {
                font-size: 96px;
            }
            .aqua-button {
                background-color: aqua;
                color: black;
                border-radius: 8px;
                text-align: center;
                padding: 8px;
                font-size: larger;
                display: inline-block;
                text-decoration: none;
            }

            .darkred-button {
                background-color: darkred;
                color: white;
                border-radius: 8px;
                text-align: center;
                padding: 8px;
                font-size: larger;
                display: inline-block;
                text-decoration: none;
            }
            .lightyellow-button {
                background-color: lightyellow;
                color: black;
                border-radius: 8px;
                text-align: center;
                padding: 8px;
                font-size: larger;
                display: inline-block;
                text-decoration: none;
            }
            .green-button {
                background-color: rgb(179, 255, 0);
                color: black;
                border-radius: 8px;
                text-align: center;
                padding: 8px;
                font-size: larger;
                display: inline-block;
                text-decoration: none;
            }
        </style>
    </head>
    <body>
        <h1>400</h1>
        <h2>哎呀……请求错误</h2>
        <h3>Bad Request</h3>
        <a href="/ZoUMusic/index.html" class="aqua-button" id="zh-cn-back">← 返回主界面</a>
        <br><br>
        <a href="/ZoUMusic/index-en.html" class="darkred-button" id="en-back">← English Page</a>
        <br><br>
        <a href="/ZoUMusic/index-ja.html" class="lightyellow-button" id="ja-back">← 日本語のトップページへ</a>
        <br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>
        <hr>
        <h3>为什么会出现该错误？</h3>
        <p>请求可能缺少必要参数，或者参数值无效。<br><b>注意</b>，这只是 ZoUMusic 内部定义的错误原因，不代表所有 HTTP 400 错误都由参数问题引起。</p>
        <script>
            const bgmode = localStorage.getItem("bgmode")
            const body = document.body
            const texts = document.querySelectorAll("p, h1, h2, h3, b")
            const zhCNBack = document.getElementById("zh-cn-back")
            const jaBack = document.getElementById("ja-back")
            if (bgmode=="dark"){
                body.className = "dark-background"
                for (const text of texts){
                    text.classList.add("brighttext")
                }
                zhCNBack.className = "darkslateblue-button"
                jaBack.className = "green-button"
            }
        </script>
    </body>
</html>
