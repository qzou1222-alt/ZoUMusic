<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <link href="/ZoUMusic/images/ZoU.png" rel="icon" type="image/png">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>个性化设置 - ZoUMusic</title>
        <style>
            .dark-background {
                background-color: black;
                color: white;
            }
            .brighttext {
                color: white;
                text-decoration-color: white;
            }
            .graytext {
                color: gray;
            }
            .info {
                display: flex;
                align-items: center;
                gap: 10px;
            }
            .info p {
                margin: 0;
            }
        </style>
    </head>
    <body>
        <h1>个性化设置</h1>
        <form action="process.html">
            <h2>主题背景模式</h2>
            <input type="radio" id="bgmode-bright" name="bgmode" value="bright" checked>
            <label for="bgmode-bright">亮色模式</label>
            <input type="radio" id="bgmode-dark" name="bgmode" value="dark">
            <label for="bgmode-dark">深色模式</label>
            <br><br>
            <h3>预览</h3>
            <img id="prv-bgmode">
            <h2>性能设置</h2>
            <h3>视频性能</h3>
            <h4>预加载</h4>
            <input type="radio" id="video-preload-auto" name="video-preload" value="auto" checked>
            <label for="video-preload-auto">预加载视频和元数据</label>
            <p class="graytext">在网页加载时加载视频和元数据。这会让网页加载时间变久。</p>
            <div class="info">
                <input type="radio" id="video-preload-metadata" name="video-preload" value="metadata">
                <label for="video-preload-metadata">预加载元数据</label>
                <p class="graytext">（推荐）</p>
            </div>
            <p class="graytext">在网页加载时只加载元数据。</p>
            <input type="radio" id="video-preload-none" name="video-preload" value="none">
            <label for="video-preload-none">禁用预加载</label>
            <p class="graytext">在网页加载时不加载任何视频数据。这会让视频加载时间变久。</p>
            <br><br><br>
            <button type="submit">完成</button>
        </form>
        <script>
            const texts = document.querySelectorAll("p, h1, h2, li, b, label")
            const preview_bgmode = document.getElementById("prv-bgmode")
            class Bgmode{
                static bright = document.getElementById("bgmode-bright")
                static dark = document.getElementById("bgmode-dark")
                static previewCheck(){
                    if (Bgmode.bright.checked){
                        preview_bgmode.src="/ZoUMusic/images/BGModePreviewBright.png"
                    }
                    else if (Bgmode.dark.checked){
                        preview_bgmode.src="/ZoUMusic/images/BGModePreviewDark.png"
                    }

                }
                
            }
            class VideoPreview{
                static auto = document.getElementById("video-preload-auto")
                static metadata = document.getElementById("video-preload-metadata")
                static none = document.getElementById("video-preload-none")
            }
            if (localStorage.getItem("bgmode")=="dark") {
                Bgmode.dark.checked=true
                Bgmode.bright.checked=false
                document.body.className="dark-background"
                for (const text of texts){
                    text.classList.add("brighttext")
                }
                
            }
            if (localStorage.getItem("video-preview")=="metadata") {
                VideoPreview.auto.checked=false
                VideoPreview.metadata.checked=true
                VideoPreview.none.checked=false
            }
            if (localStorage.getItem("video-preview")=="none") {
                VideoPreview.auto.checked=false
                VideoPreview.metadata.checked=false
                VideoPreview.none.checked=true
            }
            Bgmode.previewCheck()
            Bgmode.bright.addEventListener("change", function(ev){
                Bgmode.previewCheck()
            })

            Bgmode.dark.addEventListener("change", function(ev){
                Bgmode.previewCheck()
            })
        </script>
        <script src="/ZoUMusic/traffic/traffic.js"></script>
    </body>
</html>
