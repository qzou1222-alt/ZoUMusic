
<!DOCTYPE html>
<html lang="en">
    
    <head>
        <link href="/ZoUMusic/images/ZoU.png" rel="icon" type="image/png">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ZoUMusic - Select Language</title>
        <style>
            .dark-background {
                background-color: black;
                color: white;
            } 
            .bright-background {
                background-color: white;
            }
            .brightlink {
                color: lightblue;
                text-decoration-color: lightblue;
            }
            .brighttext {
                color: white;
                text-decoration-color: white;
            }
            .darkslateblue-button {
                background-color: darkslateblue;
                color: white;
                border-radius: 8px;
                text-align: center;
                padding: 8px;
                font-size: larger;
                display: inline-block;
                text-decoration: none;
            }
            body {
                font-family: Arial, sans-serif;
                text-align: center;
                padding-top: 80px;
            }

            select {
                font-size: 16px;
                padding: 8px;
                border-radius: 8px;
            }
            .aqua-surface {
                border: 2px solid red;
                color: black;
                border-radius: 8px;
                text-align: center;
                padding: 32px;
                font-size: larger;
                display: inline-block;
                text-decoration: none;
            }
            .aqua-button {
                background-color: aqua;
                color: black;
                border-radius: 8px;
                text-align: center;
                padding: 8px;
                font-size: larger;
                display: inline-block;
                text-decoration: none;
            }
        </style>
    </head>
    <body>
        <div class="aqua-surface">
            <h1>ZoUMusic</h1>
            <label for="language">Select a language:</label>
            <br><br>
            <select id="language" name="language">
                <option value="en">English</option>
                <option value="zh">简体中文</option>
                <option value="ja">日本語</option>
            </select>
            <br><br>
            <button class="aqua-button" id="switch-language">OK</button>
            <script>
                const language = document.getElementById("language");
                const button = document.getElementById("switch-language");
                            
                button.addEventListener("click", () => {
                    const pages = {
                        zh: "index.html",
                        en: "index-en.html",
                        ja: "index-ja.html"
                    };
                
                    window.location.href = pages[language.value];
                });
            </script>
        </div>
        <script>
            const bgmode = localStorage.getItem("bgmode")
            const body = document.body
            const links = document.getElementsByTagName("a")
            const texts = document.querySelectorAll("h1, label")
            const switchLanguage = document.getElementById("switch-language")
            if (bgmode=="dark"){
                body.className = "dark-background"
                for (const link of links){
                    link.classList.add("brightlink")
                }
                for (const text of texts){
                    text.classList.add("brighttext")
                }
                switchLanguage.className = "darkslateblue-button"
            }
        </script>
    </body>
</html>
