
<!DOCTYPE html>
<html lang="zh-CN">
    
    <head>
        <link href="/ZoUMusic/images/ZoU.png" rel="icon" type="image/png">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ZoUMusic - 选择语言</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                text-align: center;
                padding-top: 80px;
            }

            select {
                font-size: 16px;
                padding: 8px;
                border-radius: 8px;
            }
            .aqua-surface {
                border: 2px solid red;
                color: black;
                border-radius: 8px;
                text-align: center;
                padding: 32px;
                font-size: larger;
                display: inline-block;
                text-decoration: none;
            }
            .aqua-button {
                background-color: aqua;
                color: black;
                border-radius: 8px;
                text-align: center;
                padding: 8px;
                font-size: larger;
                display: inline-block;
                text-decoration: none;
            }
        </style>
    </head>
    <body>
        <div class="aqua-surface">
            <h1>ZoUMusic</h1>
            <label for="language">选择语言：</label>
            <br><br>
            <select id="language" name="language">
                <option value="zh">简体中文</option>
                <option value="en">English</option>
                <option value="ja">日本語</option>
            </select>
            <br><br>
            <button class="aqua-button" id="switch-language">切换语言</button>
            <script>
                const language = document.getElementById("language");
                const button = document.getElementById("switch-language");
                            
                button.addEventListener("click", () => {
                    const pages = {
                        zh: "index.html",
                        en: "index-en.html",
                        ja: "index-ja.html"
                    };
                
                    window.location.href = pages[language.value];
                });
            </script>
        </div>
    </body>
</html>
